services:
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: wuxing-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - backend-net

  wuxing-backend:
    build: .
    container_name: wuxing-backend
    env_file:
      - .env
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend-net
      - hermes-net
    volumes:
      - backend_data:/app/data
      - /root/wuxing-backend/backups:/backups
    depends_on:
      - qdrant
      - redis

  redis:
    image: redis:7-alpine
    container_name: wuxing-redis
    restart: unless-stopped
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
  hermes-net:
    external: true
    name: hermes_hermes-net

volumes:
  qdrant_data:
  backend_data:
