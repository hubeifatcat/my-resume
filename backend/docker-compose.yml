services:
  wuxing-backend:
    build: .
    container_name: wuxing-backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hermes-net

networks:
  hermes-net:
    external: true
    name: hermes_hermes-net
