services:
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: wuxing-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - backend-net

  wuxing-backend:
    build: .
    container_name: wuxing-backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend-net
      - hermes-net
    volumes:
      - backend_data:/app/data
    depends_on:
      - qdrant

networks:
  backend-net:
    driver: bridge
  hermes-net:
    external: true
    name: hermes_hermes-net

volumes:
  qdrant_data:
  backend_data:
