<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 助手 · 武渭星</title>
    <meta name="description" content="AI 运维助手 - 基于本地大模型的智能问答" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #0b1220;
            --ink-2: #334155;
            --ink-3: #64748b;
            --paper: #ffffff;
            --paper-2: #f7f9fc;
            --line: #e3e8f0;
            --blue: #2563eb;
            --blue-2: #3b82f6;
            --cyan: #0891b2;
            --green: #059669;
            --amber: #d97706;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 30px rgba(11, 18, 32, 0.08);
            --shadow-lg: 0 20px 50px rgba(11, 18, 32, 0.12);
            --font: "Inter", "Noto Sans SC", -apple-system, "Segoe UI", sans-serif;
            --nav-h: 68px;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: var(--font);
            color: var(--ink);
            background: var(--paper);
            line-height: 1.65;
            letter-spacing: 0;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1120px, 100% - 40px);
            margin: 0 auto;
        }

        /* Nav */
        .site-nav {
            flex-shrink: 0;
            height: var(--nav-h);
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }

        .site-nav .container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.05rem;
        }

        .brand .mark {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            color: #fff;
            font-size: 0.85rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--ink-2);
        }

        .nav-links a.active {
            color: var(--blue);
            font-weight: 700;
        }

        /* Workspace + side panel */
        .workspace {
            flex: 1;
            min-height: 0;
            width: min(1120px, 100% - 40px);
            margin: 0 auto;
            padding: 16px 0 0;
            display: flex;
            gap: 16px;
        }

        .side-panel {
            width: 272px;
            flex-shrink: 0;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #fff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .side-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .side-head h2 {
            font-size: 0.98rem;
            font-weight: 800;
        }

        .side-head .count {
            font-size: 0.76rem;
            color: var(--ink-3);
            background: var(--paper-2);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 2px 9px;
        }

        .side-group h3 {
            font-size: 0.82rem;
            color: var(--ink-3);
            text-transform: uppercase;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--line);
        }

        .side-item {
            display: flex;
            gap: 10px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .side-item:hover {
            border-color: var(--blue-2);
        }

        .side-item input {
            margin-top: 3px;
            accent-color: var(--blue);
            flex-shrink: 0;
        }

        .side-item .name {
            font-size: 0.86rem;
            font-weight: 600;
        }

        .side-item .desc {
            font-size: 0.76rem;
            color: var(--ink-3);
            margin-top: 2px;
        }

        .side-note {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px dashed var(--line);
            font-size: 0.74rem;
            color: var(--ink-3);
        }

        .side-toggle {
            display: none;
            align-items: center;
            gap: 6px;
            margin: 14px auto 0;
            padding: 8px 16px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--ink-2);
            font-size: 0.84rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
        }

        /* Chat header */
        .chat-header {
            flex-shrink: 0;
            padding: 34px 0 10px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: 0;
        }

        .chat-header h1 span {
            color: var(--blue);
        }

        .chat-header p {
            color: var(--ink-3);
            font-size: 0.9rem;
            max-width: 560px;
            margin: 6px auto 0;
        }

        .side-toggle-wrap {
            text-align: center;
        }

        .status-bar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            background: rgba(217, 119, 6, 0.08);
            color: var(--amber);
            border: 1px solid rgba(217, 119, 6, 0.2);
        }

        .status-bar .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--amber);
        }

        .status-bar.online {
            background: rgba(5, 150, 105, 0.08);
            color: var(--green);
            border-color: rgba(5, 150, 105, 0.2);
        }

        .status-bar.online .dot {
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Chat area */
        .chat-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .chat {
            width: min(760px, 100%);
            padding: 18px 20px 150px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .msg {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        .msg.bot {
            align-self: flex-start;
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .msg.bot .avatar {
            background: var(--ink);
            color: #fff;
        }

        .msg.user .avatar {
            background: var(--paper-2);
            border: 1px solid var(--line);
            color: var(--ink-2);
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.75;
        }

        .msg.bot .bubble {
            background: #fff;
            border: 1px solid var(--line);
            border-bottom-left-radius: 5px;
        }

        .msg.user .bubble {
            background: var(--blue);
            color: #fff;
            border-bottom-right-radius: 5px;
        }

        .bubble .timestamp {
            display: block;
            margin-top: 6px;
            font-size: 0.72rem;
            color: var(--ink-3);
        }

        .msg.user .bubble .timestamp {
            color: rgba(255, 255, 255, 0.68);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .suggestions button {
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(37, 99, 235, 0.18);
            background: rgba(37, 99, 235, 0.06);
            color: var(--blue);
            font-size: 0.82rem;
            font-family: var(--font);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .suggestions button:hover {
            background: rgba(37, 99, 235, 0.12);
            transform: translateY(-1px);
        }

        .typing .bubble {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 16px 20px;
        }

        .typing .bubble span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ink-3);
            animation: bounce 1.4s infinite;
        }

        .typing .bubble span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing .bubble span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Input */
        .input-area {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 50;
            background: linear-gradient(to top, rgba(255, 255, 255, 1) 55%, rgba(255, 255, 255, 0));
            padding: 14px 20px 20px;
        }

        .input-box {
            width: min(760px, 100%);
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 6px;
            box-shadow: var(--shadow-lg);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .input-box textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            padding: 10px 14px;
            font-size: 0.92rem;
            font-family: var(--font);
            color: var(--ink);
            line-height: 1.5;
            max-height: 120px;
            background: transparent;
        }

        .input-box textarea::placeholder {
            color: var(--ink-3);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border: none;
            border-radius: 11px;
            background: var(--blue);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s ease, opacity 0.2s ease;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .disclaimer {
            width: min(760px, 100%);
            margin: 8px auto 0;
            text-align: center;
            font-size: 0.74rem;
            color: var(--ink-3);
        }

        @media (max-width: 640px) {
            .chat-header h1 {
                font-size: 1.35rem;
            }

            .msg {
                max-width: 94%;
            }

            .chat {
                padding-bottom: 132px;
            }

            .side-toggle {
                display: inline-flex;
            }

            .workspace {
                width: 100%;
                padding: 0;
                position: relative;
            }

            .side-panel {
                position: fixed;
                z-index: 45;
                top: var(--nav-h);
                bottom: 0;
                left: 0;
                width: 300px;
                max-width: 86vw;
                border-radius: 0 14px 14px 0;
                transform: translateX(-102%);
                transition: transform 0.25s ease;
                box-shadow: var(--shadow-lg);
            }

            .side-panel.open {
                transform: none;
            }

            .chat-wrap {
                padding-top: 8px;
            }
        }
    </style>
</head>
<body>

<nav class="site-nav">
    <div class="container">
        <a href="index.html" class="brand">
            <span class="mark">武</span>
            <span>武渭星</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">简历</a></li>
            <li><a href="ai-chat.html" class="active">AI 助手</a></li>
        </ul>
    </div>
</nav>

<header class="chat-header">
    <h1>AI <span>运维助手</span></h1>
    <p>基于本地大模型（Ollama + Qwen）的智能问答 · 后端部署中</p>
    <div class="status-bar" id="statusBar">
        <span class="dot"></span>
        <span id="statusText">后端部署中 · 当前为模拟回复</span>
    </div>
    <div class="side-toggle-wrap">
        <button class="side-toggle" id="sideToggle">工具与 Skill</button>
    </div>
</header>

<div class="workspace">
    <aside class="side-panel" id="sidePanel">
        <div class="side-head">
            <h2>SKILL / MCP 工具</h2>
            <span class="count" id="toolCount">0 已选</span>
        </div>
        <div class="side-group">
            <h3>Skill</h3>
            <div id="skillsList"></div>
        </div>
        <div class="side-group">
            <h3>MCP 工具</h3>
            <div id="mcpList"></div>
        </div>
        <div class="side-note">当前为前端占位列表，后端接入后自动加载真实工具</div>
    </aside>

    <main class="chat-wrap">
        <div class="chat" id="chatContainer">
            <div class="msg bot">
                <div class="avatar">AI</div>
                <div class="bubble">
                    你好，我是武渭星的 AI 运维助手，可以问他关于工作经历、技术栈、项目和联系方式的问题。
                    <div class="suggestions">
                        <button onclick="askSuggestion('他有什么工作经历？')">工作经历</button>
                        <button onclick="askSuggestion('他擅长什么技术？')">技术栈</button>
                        <button onclick="askSuggestion('他做过什么项目？')">项目经验</button>
                        <button onclick="askSuggestion('怎么联系他？')">联系方式</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea id="chatInput" rows="1" placeholder="输入你的问题…" onkeydown="handleKeydown(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>→</button>
    </div>
    <div class="disclaimer">AI 回复仅供参考，后端部署完成后将接入本地大模型</div>
</div>

<script>
    // 后端接入点：部署完成后把这里改成你的 API 地址（如 https://api.example.com/chat）
    const BACKEND_URL = "";

    const chatContainer = document.getElementById("chatContainer");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusBar = document.getElementById("statusBar");
    const statusText = document.getElementById("statusText");
    const sidePanel = document.getElementById("sidePanel");
    const sideToggle = document.getElementById("sideToggle");
    const toolCount = document.getElementById("toolCount");
    const skillsList = document.getElementById("skillsList");
    const mcpList = document.getElementById("mcpList");

    // 前端占位的 Skill 与 MCP 工具，后端接入后改为动态加载
    const skills = [
        { id: "fault-diagnosis", name: "故障排查", desc: "按日志链路定位故障根因" },
        { id: "log-analysis", name: "日志分析", desc: "日志摘要、异常提取" },
        { id: "inspection-script", name: "巡检脚本", desc: "生成 Shell/Python 巡检脚本" },
        { id: "rag-search", name: "知识库检索", desc: "RAG 检索运维知识库" }
    ];
    const mcpTools = [
        { id: "server-status", name: "服务器状态", desc: "CPU / 内存 / 磁盘 / 进程" },
        { id: "log-query", name: "日志查询", desc: "按关键字查询最近日志" },
        { id: "ticket-create", name: "工单创建", desc: "创建变更 / 故障工单" }
    ];
    const selectedSkills = new Set();
    const selectedTools = new Set();

    function renderTools() {
        skillsList.innerHTML = "";
        mcpList.innerHTML = "";
        skills.forEach((s) => {
            const label = document.createElement("label");
            label.className = "side-item";
            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = selectedSkills.has(s.id);
            input.addEventListener("change", () => {
                if (input.checked) selectedSkills.add(s.id);
                else selectedSkills.delete(s.id);
                updateToolCount();
            });
            const body = document.createElement("div");
            const name = document.createElement("div");
            name.className = "name";
            name.textContent = s.name;
            const desc = document.createElement("div");
            desc.className = "desc";
            desc.textContent = s.desc;
            body.appendChild(name);
            body.appendChild(desc);
            label.appendChild(input);
            label.appendChild(body);
            skillsList.appendChild(label);
        });
        mcpTools.forEach((t) => {
            const label = document.createElement("label");
            label.className = "side-item";
            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = selectedTools.has(t.id);
            input.addEventListener("change", () => {
                if (input.checked) selectedTools.add(t.id);
                else selectedTools.delete(t.id);
                updateToolCount();
            });
            const body = document.createElement("div");
            const name = document.createElement("div");
            name.className = "name";
            name.textContent = t.name;
            const desc = document.createElement("div");
            desc.className = "desc";
            desc.textContent = t.desc;
            body.appendChild(name);
            body.appendChild(desc);
            label.appendChild(input);
            label.appendChild(body);
            mcpList.appendChild(label);
        });
    }

    function updateToolCount() {
        toolCount.textContent = (selectedSkills.size + selectedTools.size) + " 已选";
    }

    sideToggle.addEventListener("click", () => {
        sidePanel.classList.toggle("open");
    });

    renderTools();

    chatInput.addEventListener("input", () => {
        sendBtn.disabled = chatInput.value.trim() === "";
        chatInput.style.height = "auto";
        chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
    });

    function handleKeydown(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function askSuggestion(text) {
        chatInput.value = text;
        sendBtn.disabled = false;
        sendMessage();
    }

    function addMessage(role, content, isTyping = false) {
        const div = document.createElement("div");
        div.className = "msg " + role + (isTyping ? " typing" : "");
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "bot" ? "AI" : "我";
        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (isTyping) {
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement("span");
                bubble.appendChild(dot);
            }
        } else {
            bubble.innerHTML = content;
            const ts = document.createElement("span");
            ts.className = "timestamp";
            ts.textContent = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
            bubble.appendChild(ts);
        }

        div.appendChild(avatar);
        div.appendChild(bubble);
        chatContainer.appendChild(div);
        scrollToBottom();
        return div;
    }

    function removeTyping() {
        const typing = chatContainer.querySelector(".msg.typing");
        if (typing) typing.remove();
    }

    const knowledgeBase = {
        "工作经历": "武渭星有 3 年政企实施运维经验：\n\n1. 中电金信（2025.03-至今）实施运维专员，负责国网数字化审计平台阿里云运维，涉及 Docker/K8s、Nacos、Redis、Nginx 等中间件，保障 99.9% 可用率。\n2. 北京金轩锋（2024.07-2025.03）运维专员，7×24 视频监控平台，Zabbix+Grafana 监控看板。\n3. 南京华苏科技（2023.10-2024.06）实施工程师，微服务部署升级、Oracle 到 MySQL 迁移、Jenkins CI/CD。",
        "技术": "云平台：阿里云、Docker、Kubernetes\n中间件：Nginx、Redis、Nacos、Sentinel\n数据库：MySQL、Oracle\n监控：Zabbix、Grafana、ELK、Prometheus\nCI/CD：Jenkins、Git\n编程：Shell（熟练）、Python（掌握）、Go（基础）\nAI：Ollama 私有化部署、Dify、RAG 知识库、Claude Code",
        "项目": "1. 智能运维知识库 Agent：多智能体 + Hybrid RAG + 本地大模型 + MCP 受控工具调用。\n2. 私有化大模型辅助运维工具：Ollama + Dify + RAG，故障定位 10min→1min。\n3. 统一权限 3.0 架构升级：单体转微服务 + 阿里云迁移 + Oracle→MySQL。\n4. 基于 GVA 架构的社区管理平台（毕设）：Go + Vue 前后端分离。",
        "联系": "电话：190-5475-0791\n邮箱：18335357090@163.com\n微信：wwx-_-168\nGitHub：github.com/hubeifatcat\n简历网站：hubeifatcat.github.io/my-resume",
        "你好": "你好！我是武渭星的 AI 助手，可以问他的工作经历、技术能力、项目经验等问题。",
        "你是谁": "我是武渭星的 AI 运维助手，当前为前端模拟回复模式，后端正在接入本地大模型。"
    };

    const fallbackResponses = [
        "好问题，不过这个超出了我的知识范围，建议直接联系武渭星本人详聊。",
        "这个问题我需要想想，你可以通过邮箱 18335357090@163.com 联系他。",
        "这个细节我不太确定，直接和他本人沟通更准确。",
        "这块我还没学会，他的技术栈还在不断扩展中。"
    ];

    function findAnswer(input) {
        const lower = input.toLowerCase();
        for (const [key, answer] of Object.entries(knowledgeBase)) {
            if (input.includes(key) || lower.includes(key)) return answer;
        }
        if (lower.includes("经历") || lower.includes("经验") || lower.includes("工作")) return knowledgeBase["工作经历"];
        if (lower.includes("技术") || lower.includes("技能") || lower.includes("擅长") || lower.includes("栈")) return knowledgeBase["技术"];
        if (lower.includes("项目") || lower.includes("做过")) return knowledgeBase["项目"];
        if (lower.includes("联系") || lower.includes("电话") || lower.includes("邮箱") || lower.includes("微信")) return knowledgeBase["联系"];
        if (lower.includes("你好") || lower.includes("hello") || lower.includes("hi")) return knowledgeBase["你好"];
        if (lower.includes("你是谁") || lower.includes("什么") || lower.includes("干嘛")) return knowledgeBase["你是谁"];
        if (lower.includes("ai") || lower.includes("模型") || lower.includes("大模型") || lower.includes("ollama") || lower.includes("dify")) {
            return "武渭星在 AI 辅助运维方面有完整实践：Docker 部署 Ollama 运行 Qwen2.5，搭建 Dify 平台编排 Chatflow/Workflow，构建基于 Obsidian 的 RAG 知识库，实现 AI 辅助故障排查与文档生成。";
        }
        return null;
    }

    function getSmartResponse(input) {
        const direct = findAnswer(input);
        return direct || fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        addMessage("user", text);
        chatInput.value = "";
        chatInput.style.height = "auto";
        sendBtn.disabled = true;
        addMessage("bot", "", true);

        if (BACKEND_URL) {
            try {
                const resp = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: text,
                        skills: Array.from(selectedSkills),
                        tools: Array.from(selectedTools)
                    }),
                    signal: AbortSignal.timeout(20000)
                });
                if (resp.ok) {
                    const data = await resp.json();
                    removeTyping();
                    addMessage("bot", data.answer || "暂无回复");
                    return;
                }
            } catch (e) {
                // 后端不可用时回退到模拟回复
            }
        }

        await new Promise((r) => setTimeout(r, 500 + Math.random() * 1000));
        removeTyping();
        addMessage("bot", getSmartResponse(text));
    }

    async function checkBackend() {
        if (BACKEND_URL) {
            try {
                const resp = await fetch(BACKEND_URL, { method: "GET", signal: AbortSignal.timeout(3000) });
                if (resp.ok) {
                    statusBar.classList.add("online");
                    statusText.textContent = "后端服务已连接 · 真实 AI 回复中";
                    return;
                }
            } catch (e) {
                // ignore
            }
        }
        try {
            const resp = await fetch("http://localhost:11434/api/tags", { signal: AbortSignal.timeout(3000) });
            if (resp.ok) {
                statusBar.classList.add("online");
                statusText.textContent = "本地 Ollama 已连接 · 真实 AI 回复中";
            }
        } catch (e) {
            // 本地无模型，保持模拟模式
        }
    }

    chatInput.style.height = "auto";
    checkBackend();
</script>
