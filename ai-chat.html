<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 助手 · 武渭星</title>
    <meta name="description" content="AI 运维助手 - 基于本地大模型的智能问答" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --primary-glow: rgba(37,99,235,.2);
            --accent-violet: #8b5cf6;
            --accent-green: #10b981;
            --bg: #f8fafc;
            --surface: rgba(255,255,255,.92);
            --surface-solid: #fff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text2: #475569;
            --text3: #94a3b8;
            --shadow-md: 0 4px 6px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.04);
            --shadow-lg: 0 10px 25px rgba(0,0,0,.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: .3s cubic-bezier(.4,0,.2,1);
            --font: 'Inter', 'Noto Sans SC', -apple-system, system-ui, sans-serif;
        }
        html, body { height: 100%; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--primary); text-decoration: none; transition: var(--transition); }
        a:hover { color: var(--primary-dark); }

        /* Nav */
        nav {
            flex-shrink: 0;
            height: 64px;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        nav .container {
            max-width: 1100px; margin: 0 auto; padding: 0 24px;
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }
        .nav-logo { font-weight: 800; font-size: 1.1rem; color: var(--text); }
        .nav-logo span { color: var(--primary); }
        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a { color: var(--text2); font-size: .88rem; font-weight: 500; }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a.active { color: var(--primary); font-weight: 600; }
        .nav-links a.active::after { content: ''; display: block; height: 2px; background: var(--primary); border-radius: 1px; margin-top: 2px; }

        /* Hero */
        .chat-hero {
            flex-shrink: 0;
            padding: 40px 24px 0;
            text-align: center;
        }
        .chat-hero h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
        .chat-hero h1 span { background: linear-gradient(135deg, var(--primary), var(--accent-violet)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .chat-hero p { color: var(--text3); font-size: .9rem; max-width: 500px; margin: 0 auto; }

        /* ===== Status Bar ===== */
        .status-bar {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin: 16px auto 0; padding: 6px 20px; border-radius: 50px;
            font-size: .78rem; font-weight: 500;
            background: rgba(245,158,11,.1); color: #b45309;
            border: 1px solid rgba(245,158,11,.2);
        }
        .status-bar .dot { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; }
        .status-bar.online { background: rgba(16,185,129,.1); color: var(--accent-green); border-color: rgba(16,185,129,.2); }
        .status-bar.online .dot { background: var(--accent-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ===== Chat Container ===== */
        .chat-container {
            flex: 1;
            max-width: 740px;
            margin: 0 auto;
            padding: 20px 24px 160px;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Messages */
        .msg {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: msgIn .35s ease;
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .msg.bot { align-self: flex-start; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }

        .msg .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .9rem; flex-shrink: 0;
        }
        .msg.bot .avatar { background: linear-gradient(135deg, var(--primary), var(--accent-violet)); color: #fff; }
        .msg.user .avatar { background: var(--surface-hover); color: var(--text2); border: 1px solid var(--border); }

        .msg .bubble {
            padding: 12px 18px;
            border-radius: 14px;
            font-size: .9rem;
            line-height: 1.7;
            position: relative;
        }
        .msg.bot .bubble {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .msg.user .bubble {
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg .bubble .timestamp {
            font-size: .7rem;
            color: var(--text3);
            margin-top: 6px;
            display: block;
        }
        .msg.user .bubble .timestamp { color: rgba(255,255,255,.6); }

        /* Welcome message suggestions */
        .suggestions {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
        }
        .suggestions button {
            padding: 6px 16px; border-radius: 50px; font-size: .8rem;
            background: rgba(37,99,235,.06); color: var(--primary);
            border: 1px solid rgba(37,99,235,.15); cursor: pointer;
            transition: var(--transition); font-family: var(--font);
        }
        .suggestions button:hover {
            background: rgba(37,99,235,.12); border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* Typing indicator */
        .typing .bubble {
            display: flex; align-items: center; gap: 4px; padding: 16px 20px;
        }
        .typing .bubble .typing-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text3); animation: typingBounce 1.4s infinite;
        }
        .typing .bubble .typing-dot:nth-child(2) { animation-delay: .2s; }
        .typing .bubble .typing-dot:nth-child(3) { animation-delay: .4s; }
        @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

        /* ===== Input Area ===== */
        .input-area {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(248,250,252,1) 60%, transparent);
            padding: 16px 24px 24px;
        }
        .input-area .input-wrapper {
            max-width: 740px; margin: 0 auto;
            display: flex; gap: 10px;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
        }
        .input-area .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .input-area textarea {
            flex: 1; border: none; outline: none; resize: none;
            padding: 10px 14px; font-size: .92rem; font-family: var(--font);
            background: transparent; color: var(--text);
            line-height: 1.5; max-height: 120px;
        }
        .input-area textarea::placeholder { color: var(--text3); }
        .input-area .send-btn {
            width: 44px; height: 44px; border-radius: 11px; border: none;
            background: var(--primary); color: #fff; font-size: 1.2rem;
            cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .input-area .send-btn:hover { background: var(--primary-dark); }
        .input-area .send-btn:disabled { opacity: .4; cursor: not-allowed; }
        .input-area .disclaimer {
            text-align: center; font-size: .72rem; color: var(--text3);
            margin-top: 8px;
        }

        /* ===== Footer ===== */
        footer {
            flex-shrink: 0;
            padding: 20px 24px; text-align: center;
            font-size: .82rem; color: var(--text3);
            border-top: 1px solid var(--border);
            display: none;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .msg { max-width: 92%; }
            .chat-container { padding-bottom: 140px; }
            .chat-hero h1 { font-size: 1.3rem; }
            .nav-links { gap: 14px; }
            .nav-links a { font-size: .82rem; }
        }
        @media (max-width: 480px) {
            .msg .bubble { font-size: .85rem; padding: 10px 14px; }
            .input-area { padding: 12px 16px 20px; }
        }
    </style>
</head>
<body>

<!-- Nav -->
<nav>
    <div class="container">
        <a href="index.html" class="nav-logo">武<span>渭星</span></a>
        <ul class="nav-links">
            <li><a href="index.html">简历</a></li>
            <li><a href="ai-chat.html" class="active">AI 助手</a></li>
        </ul>
    </div>
</nav>

<!-- Hero -->
<div class="chat-hero">
    <h1>🤖 <span>AI</span> 运维助手</h1>
    <p>基于本地大模型（Ollama + Qwen）的智能问答 · 后端部署中</p>
    <div class="status-bar" id="statusBar">
        <span class="dot"></span>
        <span id="statusText">后端部署中 · 当前为模拟回复</span>
    </div>
</div>

<!-- Chat Messages -->
<div class="chat-container" id="chatContainer">
    <!-- Welcome message -->
    <div class="msg bot">
        <div class="avatar">🤖</div>
        <div class="bubble">
            👋 你好！我是武渭星的 AI 运维助手。<br /><br />
            你可以问我关于他的任何问题，比如：
            <div class="suggestions">
                <button onclick="askSuggestion('他有什么工作经历？')">📋 工作经历</button>
                <button onclick="askSuggestion('他擅长什么技术？')">🛠️ 技术栈</button>
                <button onclick="askSuggestion('他做过什么项目？')">🚀 项目经验</button>
                <button onclick="askSuggestion('怎么联系他？')">📬 联系方式</button>
            </div>
        </div>
    </div>
</div>

<!-- Input Area -->
<div class="input-area">
    <div class="input-wrapper">
        <textarea id="chatInput" rows="1" placeholder="输入你的问题…" onkeydown="handleKeydown(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
    </div>
    <div class="disclaimer">AI 回复仅供参考，后端部署完成后将接入本地大模型</div>
</div>

<script>
    const chatContainer = document.getElementById('chatContainer');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusBar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');

    // Enable/disable send button based on input
    chatInput.addEventListener('input', () => {
        sendBtn.disabled = chatInput.value.trim() === '';
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
    });

    function handleKeydown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Suggestion click handler
    function askSuggestion(text) {
        chatInput.value = text;
        sendBtn.disabled = false;
        sendMessage();
    }

    // Add a message to the chat
    function addMessage(role, content, isTyping = false) {
        const div = document.createElement('div');
        div.className = `msg ${role}${isTyping ? ' typing' : ''}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'bot' ? '🤖' : '👤';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (isTyping) {
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                dot.className = 'typing-dot';
                bubble.appendChild(dot);
            }
        } else {
            bubble.innerHTML = content;
            const ts = document.createElement('span');
            ts.className = 'timestamp';
            ts.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            bubble.appendChild(ts);
        }

        div.appendChild(avatar);
        div.appendChild(bubble);
        chatContainer.appendChild(div);
        scrollToBottom();
        return div;
    }

    // Remove typing indicator
    function removeTyping() {
        const typing = chatContainer.querySelector('.msg.typing');
        if (typing) typing.remove();
    }

    // ===== Knowledge Base =====
    // Simple Q&A responses based on resume data
    const knowledgeBase = {
        '工作经历': `武渭星有 3 年政企实施运维经验：

**1. 中电金信（2025.03-至今）** — 实施运维专员
负责国网数字化审计平台的阿里云运维，涉及 Docker/K8s、Nacos、Redis、Nginx 等中间件维护，保障平台 99.9% 可用率。

**2. 北京金轩锋（2024.07-2025.03）** — 运维专员
7×24 小时视频监控平台运维，对接移动、公安监控链路，基于 Zabbix+Grafana 搭建监控看板。

**3. 南京华苏科技（2023.10-2024.06）** — 实施工程师
微服务架构部署升级、Oracle→MySQL 数据迁移、Jenkins+Git CI/CD 流程。`,

        '技术': `**🖥️ 操作系统：** CentOS、麒麟OS、Ubuntu
**☁️ 云平台：** 阿里云（熟练）、Docker / Docker Compose、Kubernetes（进阶中）
**🗄️ 中间件：** Nginx、Redis、Nacos、Sentinel
**🗃️ 数据库：** MySQL、Oracle（含数据迁移）
**📊 监控：** Zabbix、Grafana、ELK、Prometheus（学习中）
**🔧 CI/CD：** Jenkins、Git
**💻 编程：** Shell（熟练）、Python（掌握）、Go（基础）

**🤖 AI 差异化技能**
• Ollama 私有化大模型部署（Qwen2.5）
• Dify 平台搭建与 Chatflow/Workflow 编排
• RAG 知识库构建与 Embedding 模型配置
• Claude Code / GitHub Copilot 辅助编码
• Obsidian 双链笔记搭建运维知识图谱`,

        '项目': `**⭐ 私有化大模型辅助运维工具（个人实践）**
在本地 CentOS 服务器部署 Ollama + Qwen2.5 + Dify 平台，构建基于 Obsidian 的运维知识库，实现 AI 辅助故障排查。高频故障定位从 10 分钟压缩到 1 分钟内，脚本编写效率提升 40%。

**📋 统一权限 3.0 架构升级**
微服务架构改造 + 阿里云部署 + Oracle→MySQL 数据迁移，独立编写全套交付文档。

**💻 基于 GVA 架构的社区管理平台（毕设）**
Go + Vue 前后端分离，JWT 鉴权、CORS 跨域、ElementUI 前端搭建。`,

        '联系': `📱 **电话：** 190-5475-0791
📧 **邮箱：** 18335357090@163.com
💬 **微信：** wxw-_-168
🐙 **GitHub：** [github.com/hubeifatcat](https://github.com/hubeifatcat)
🌐 **简历网站：** [hubeifatcat.github.io/my-resume](https://hubeifatcat.github.io/my-resume)

📍 目前在北京，开放实施运维岗位机会！`,

        '你好': '你好！我是武渭星的 AI 助手，你可以问我关于他的工作经历、技术能力、项目经验等方面的问题。',
        '你好呀': '你好！我是武渭星的 AI 助手，你可以问我关于他的工作经历、技术能力、项目经验等方面的问题。',
        'hi': 'Hi there! I\'m the AI assistant of Wu Weixing. Feel free to ask about his experience and skills. (I can respond in Chinese 😊)',
        'hello': 'Hello! I\'m the AI assistant of Wu Weixing. Feel free to ask about his experience and skills. (I can respond in Chinese 😊)',
        '你是谁': '我是武渭星的 AI 运维助手，基于本地大模型（Ollama + Qwen2.5）构建。目前正在接入后端服务器，当前为前端模拟回复模式。',
        '做什么': '我可以回答关于武渭星的工作经历、技术能力、项目经验、联系方式等问题，也可以聊一些运维技术话题！',
    };

    // Fallback response
    const fallbackResponses = [
        '好问题！不过这个超出了我的知识范围，建议直接联系武渭星本人详聊～',
        '这个问题我得想想… 你可以加他微信（wxw-_-168）直接沟通！',
        '关于这个我暂时没有更多的信息，你可以通过邮箱 18335357090@163.com 联系他。',
        '这个细节我不太确定，建议直接和他本人沟通更准确！📬',
        '这块我还没学会，不过他的技术栈在不断扩展中，可以联系他了解最新情况～',
    ];

    // Simple keyword matching
    function findAnswer(input) {
        const lower = input.toLowerCase();

        // Direct match on knowledge base keys
        for (const [key, answer] of Object.entries(knowledgeBase)) {
            if (input.includes(key) || lower.includes(key)) {
                return answer;
            }
        }

        // Keyword matching
        if (lower.includes('经历') || lower.includes('经验') || lower.includes('工作')) return knowledgeBase['工作经历'];
        if (lower.includes('技术') || lower.includes('技能') || lower.includes('会什么') || lower.includes('擅长') || lower.includes('栈')) return knowledgeBase['技术'];
        if (lower.includes('项目') || lower.includes('做过')) return knowledgeBase['项目'];
        if (lower.includes('联系') || lower.includes('电话') || lower.includes('邮箱') || lower.includes('微信') || lower.includes('怎么找') || lower.includes('招聘')) return knowledgeBase['联系'];
        if (lower.includes('你好') || lower.includes('hello') || lower.includes('hi') || lower.includes('你好呀')) return knowledgeBase['你好'];
        if (lower.includes('你是谁') || lower.includes('什么') || lower.includes('干嘛') || lower.includes('作用')) return knowledgeBase['你是谁'];

        // AI related
        if (lower.includes('ai') || lower.includes('模型') || lower.includes('大模型') || lower.includes('ollama') || lower.includes('dify')) {
            return '武渭星在 AI 辅助运维方面有完整实践：在本地服务器基于 Docker 部署了 Ollama 运行 Qwen2.5 模型，搭建了 Dify 平台进行 Chatflow/Workflow 编排，构建了基于 Obsidian 的 RAG 知识库，实现了 AI 辅助故障排查与文档自动生成。';
        }

        return null;
    }

    // Smart response with keyword matching + fallback
    function getSmartResponse(input) {
        const direct = findAnswer(input);
        if (direct) return direct;
        return fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
    }

    // Send message
    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        // Add user message
        addMessage('user', text);
        chatInput.value = '';
        chatInput.style.height = 'auto';
        sendBtn.disabled = true;

        // Show typing indicator
        addMessage('bot', '', true);

        // Simulate AI thinking delay (0.5-1.5s)
        await new Promise(r => setTimeout(r, 500 + Math.random() * 1000));

        // Remove typing and add response
        removeTyping();
        const answer = getSmartResponse(text);
        addMessage('bot', answer);
    }

    // Check if Ollama backend is available (will work when deployed)
    async function checkBackend() {
        try {
            const resp = await fetch('http://localhost:11434/api/tags', { signal: AbortSignal.timeout(3000) });
            if (resp.ok) {
                statusBar.classList.add('online');
                statusText.textContent = '🟢 本地 Ollama 已连接 · 真实 AI 回复中';
            }
        } catch {
            // Backend not available - using simulation mode (expected for now)
        }
    }

    // Auto-resize textarea on page load
    chatInput.style.height = 'auto';

    // Check backend on load
    checkBackend();
</script>
</body>
</html>
